spring.application.name=Bucherei

# PostgreSQL-Datenbank
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bucherei}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Der Demo-Nutzer benötigt ein beim Start gesetztes eigenes Passwort.
app.demo-user.password=${DEMO_USER_PASSWORD}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Optional: Dialekt explizit setzen
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
